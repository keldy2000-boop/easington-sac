    <path d="M140 216 C160 208 186 206 206 212 C214 215 214 224 206 226 C186 230 160 230 142 228 Z" fill="url(#skin)" stroke="#8b96a3" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="194" y="212" width="14" height="12" rx="5" fill="#fbfcfd" stroke="#8b96a3" stroke-width="1.3"/>

    <!-- front finger: in front of the fish, so the cod sits between the two -->
    <g transform="translate(206 212) rotate(15)">
      <rect x="-18" y="-154" width="36" height="166" rx="18" fill="url(#skin)" stroke="#8b96a3" stroke-width="2"/>
      <rect x="-12" y="-148" width="24" height="26" rx="9" fill="#fbfcfd" stroke="#8b96a3" stroke-width="1.6"/>
      <path d="M-8 -133 q8 5 16 0" fill="none" stroke="#8b96a3" stroke-width="1.4"/>
