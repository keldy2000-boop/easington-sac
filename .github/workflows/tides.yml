name: Update tide times

on:
  schedule:
    - cron: "15 3 * * *"   # every morning at 03:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-tides.mjs
        env:
          ADMIRALTY_API_KEY: ${{ secrets.ADMIRALTY_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/tides.json
          git diff --cached --quiet || (git commit -m "Update tide times" && git push)
