      <path d="M130 106 Q114 138 132 170" fill="none" stroke="#2f5a91" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M138 142 C150 139 162 143 169 151 C159 155 147 155 138 151 Z" fill="#8fb3e0" stroke="#2f5a91" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="96" cy="127" r="8.5" fill="#eef4fb" stroke="#2f5a91" stroke-width="1.8"/>
      <circle cx="94" cy="127" r="4.4" fill="#14202e"/>
      <circle cx="92.4" cy="125.4" r="1.4" fill="#fff"/>
