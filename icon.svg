    <!-- the hand rising out of the sea: palm with the other fingers curled and the thumb folded across -->
    <path d="M136 214 C134 196 146 186 162 186 L218 186 C234 186 244 198 242 214 C240 232 230 246 224 266 L156 266 C150 246 138 232 136 214 Z" fill="url(#skin)" stroke="#8b96a3" stroke-width="2" stroke-linejoin="round"/>
